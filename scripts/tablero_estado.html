<title>Línea TikTok Shop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=IBM+Plex+Mono:wght@400;600&family=Figtree:wght@400;600&display=swap">
<style>
/* Tablero de metro: una línea horizontal de 6 estaciones, tren animado hacia la etapa activa, bitácora abajo */
:root{--bg:#0c0b14;--panel:#15131f;--line:#2a2638;--fg:#f1eef8;--mute:#8d87a3;--acc:#ff2d6f;--cyan:#22e4d9;--ok:#4ade80;--warn:#fbbf24;
--display:"Unbounded",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,38px);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--acc)}
.prod{font-family:var(--mono);color:var(--mute);font-size:13px;margin-top:6px;min-width:0;overflow-wrap:anywhere}
.live{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--mute)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 1.6s infinite}
.live.off i{background:var(--mute);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}100%{box-shadow:0 0 0 12px rgba(74,222,128,0)}}
.track{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 18px 26px;overflow-x:auto}
.rail{position:relative;min-width:640px;height:150px}
.bar,.fill{position:absolute;left:5%;top:44px;height:8px;border-radius:8px}
.bar{right:5%;background:var(--line)}
.fill{width:0;background:linear-gradient(90deg,var(--cyan),var(--acc));transition:width 1.2s cubic-bezier(.6,0,.2,1);box-shadow:0 0 18px rgba(255,45,111,.45)}
.fill::after{content:"";position:absolute;inset:0;border-radius:8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 10px,transparent 10px 26px);animation:flow 0.9s linear infinite;mix-blend-mode:overlay}
@keyframes flow{to{background-position:26px 0}}
.train{position:absolute;top:30px;left:5%;width:46px;height:36px;margin-left:-23px;border-radius:12px 12px 8px 8px;background:var(--acc);display:grid;place-items:center;transition:left 1.2s cubic-bezier(.6,0,.2,1);box-shadow:0 0 24px rgba(255,45,111,.7);z-index:3;animation:bob 1.1s ease-in-out infinite}
.train::before{content:"";width:28px;height:10px;border-radius:4px;background:var(--bg);opacity:.85}
.train.stop{animation:none}
@keyframes bob{50%{transform:translateY(-3px)}}
.st{position:absolute;top:30px;width:120px;margin-left:-60px;text-align:center;display:grid;justify-items:center;gap:10px}
.dot{width:36px;height:36px;border-radius:50%;background:var(--bg);border:4px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--mute);position:relative;z-index:2;transition:all .5s}
.st b{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.02em}
.st small{font-family:var(--mono);font-size:11px;color:var(--mute);line-height:1.3;min-height:2.6em}
.done .dot{border-color:var(--ok);background:var(--ok);color:var(--bg)}
.active .dot{border-color:var(--acc);color:var(--fg);animation:pulse 1.4s infinite}
.wait .dot{border-color:var(--warn);color:var(--warn);animation:pulse2 1.4s infinite}
.fail .dot{border-color:#f87171;background:#f87171;color:var(--bg)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,111,.7)}100%{box-shadow:0 0 0 18px rgba(255,45,111,0)}}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(251,191,36,.7)}100%{box-shadow:0 0 0 18px rgba(251,191,36,0)}}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card h2{margin:0 0 12px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.now{font-family:var(--display);font-size:clamp(17px,2.4vw,22px);font-weight:500;line-height:1.35;text-wrap:balance}
.now .cursor{display:inline-block;width:.55em;height:1em;background:var(--acc);vertical-align:-2px;margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ask{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--warn);color:var(--warn);font-weight:600}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-family:var(--mono);font-size:12.5px;max-height:260px;overflow:auto}
.log li{display:grid;grid-template-columns:52px 1fr;gap:10px;animation:in .5s both}
.log time{color:var(--mute);font-variant-numeric:tabular-nums}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
.meter{display:grid;gap:12px}
.m{display:grid;gap:6px;font-family:var(--mono);font-size:12px}
.m div{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.m span{display:block;height:100%;background:var(--cyan);transition:width 1s}
.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--mute);font-weight:500}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Línea <span>TikTok Shop</span></h1>
      <div class="prod" id="prod">Esperando producto…</div>
    </div>
    <div class="live off" id="live"><i></i><span id="livetxt">Conectando</span></div>
  </header>

  <section class="track"><div class="rail" id="rail">
    <div class="bar"></div><div class="fill" id="fill"></div><div class="train stop" id="train"></div>
  </div></section>

  <div class="grid">
    <section class="card">
      <h2>Ahora mismo</h2>
      <div class="now" id="now">Sin actividad todavía.<span class="cursor"></span></div>
      <div class="ask" id="ask" hidden></div>
    </section>
    <section class="card meter">
      <h2>Avance</h2>
      <div class="big" id="pct">0<small>%</small></div>
      <div class="m" id="cred" hidden><label id="credtxt"></label><div><span id="credbar" style="width:0"></span></div></div>
    </section>
  </div>

  <section class="card">
    <h2>Bitácora</h2>
    <ul class="log" id="log"><li><time>—</time><span>Aquí aparece cada paso del flujo.</span></li></ul>
  </section>
</div>

<script>
const ETAPAS=[["Investigación","Producto y datos"],["Material","Fotos reales"],["Guion","Estructura viral"],["Video IA","Google Flow"],["Edición","Cortes y SFX"],["Publicación","Carrito naranja"]];
const rail=document.getElementById('rail');
const pos=i=>5+i*18; // % a lo largo de la vía
ETAPAS.forEach(([t,s],i)=>{const d=document.createElement('div');d.className='st';d.style.left=pos(i)+'%';d.id='st'+i;
  d.innerHTML=`<div class="dot">${i+1}</div><b>${t}</b><small>${s}</small>`;rail.appendChild(d)});
const $=id=>document.getElementById(id);
function render(s){
  if(!s)return;
  $('prod').textContent=s.producto||'Esperando producto…';
  const e=Math.max(1,Math.min(6,s.etapa||1))-1, est=s.estado||'activo';
  ETAPAS.forEach((_,i)=>{const n=$('st'+i);n.className='st'+(i<e?' done':i===e?(est==='hecho'?' done':est==='espera'?' wait':est==='error'?' fail':' active'):'');
    if(s.notas&&s.notas[i])n.querySelector('small').textContent=s.notas[i]});
  $('fill').style.width=(pos(e)-5)+'%'; $('train').style.left=pos(e)+'%';
  $('train').classList.toggle('stop',est!=='activo');
  const pct=Math.round(((e+(est==='hecho'?1:est==='activo'?.5:.4))/6)*100); $('pct').innerHTML=pct+'<small>%</small>';
  const now=$('now'); now.textContent=s.ahora||''; const c=document.createElement('span');c.className='cursor';now.appendChild(c);
  $('ask').hidden=!s.pregunta; $('ask').textContent=s.pregunta?'✋ '+s.pregunta:'';
  if(typeof s.creditos==='number'){$('cred').hidden=false;$('credtxt').textContent=`Créditos Flow: ${s.creditos}/${s.creditosMax||150}`;$('credbar').style.width=(s.creditos/(s.creditosMax||150)*100)+'%'}
  if(Array.isArray(s.log)&&s.log.length){$('log').innerHTML='';s.log.slice().reverse().forEach(([t,m])=>{const li=document.createElement('li');
    const a=document.createElement('time');a.textContent=t;const b=document.createElement('span');b.textContent=m;li.append(a,b);$('log').appendChild(li)})}
}
(async()=>{
  const db=await claude.use('db');
  if(!db){$('livetxt').textContent='Sin conexión';return}
  db.doc('pipeline/actual').onSnapshot(snap=>{$('live').classList.remove('off');$('livetxt').textContent='En vivo';if(snap.exists)render(snap.data())},
    ()=>{$('live').classList.add('off');$('livetxt').textContent='Reconectando'});
})();
</script>
